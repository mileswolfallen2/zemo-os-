<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zima Server Display</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div class="brand"><span class="mark">Z</span><div><h1 id="name">ZIMA SERVER</h1><p><i></i> SYSTEM ONLINE <b>•</b> <span id="clock">--:--</span></p></div></div><div class="updated" id="updated">CONNECTING…</div></header>
<section class="hero-grid"><article class="card metric"><div class="card-top"><span>PROCESSOR</span><span class="chip" id="cores">— CORES</span></div><div class="metric-main"><div><strong id="cpu">—<small>%</small></strong><p id="cpu-model">CPU usage</p></div><div class="ring cpu-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52"/><circle id="cpu-ring" cx="60" cy="60" r="52"/></svg><span id="temp">—°</span></div></div><div class="bar"><b id="cpu-bar"></b></div><div class="foot"><span>LOAD</span><span id="cpu-load">—</span></div></article>
<article class="card metric"><div class="card-top"><span>MEMORY</span><span class="chip" id="ram-free">— FREE</span></div><div class="metric-main"><div><strong id="ram-used">—</strong><p id="ram-total">of — total</p></div><div class="ram-bars" id="ram-bars"></div></div><div class="bar purple"><b id="ram-bar"></b></div><div class="foot"><span>IN USE</span><span id="ram-pct">—</span></div></article>
<article class="card system"><div class="card-top"><span>SYSTEM</span><span class="chip green">STABLE</span></div><div class="system-grid"><div><label>UPTIME</label><strong id="uptime">—</strong></div><div><label>CPU TEMP</label><strong id="temperature">—</strong></div><div><label>NETWORK</label><strong id="interface">—</strong></div><div><label>STORAGE</label><strong id="storage-short">—</strong></div></div></article></section>
<section class="lower"><article class="card storage"><div class="card-top"><span>STORAGE</span><span id="storage-mount">—</span></div><div class="storage-row"><strong id="storage-used">—</strong><span id="storage-total">—</span><span class="storage-pct" id="storage-pct">—</span></div><div class="bar orange"><b id="storage-bar"></b></div><p class="subtle" id="storage-free">— available</p></article><article class="card network"><div class="card-top"><span>NETWORK ACTIVITY</span><span id="network-interface">—</span></div><div class="network-values"><div><label>↓ DOWNLOAD</label><strong id="down">—</strong></div><div><label>↑ UPLOAD</label><strong id="up">—</strong></div></div><div class="wave"></div></article><article class="card minecraft" id="minecraft-card"><div class="card-top"><span>MINECRAFT</span><span class="chip" id="mc-state">NOT CONFIGURED</span></div><div class="minecraft-body"><span class="cube">◆</span><div><strong id="mc-players">—</strong><p id="mc-label">Enable in config.json</p></div></div></article></section>
<section class="services"><div class="section-title"><span>RUNNING SERVICES</span><span id="service-count">—</span></div><div class="service-list" id="service-list"></div></section></main><script src="app.js"></script></body></html>
